[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loopsie"
version = "0.1.0"
description = "Make a loop, grab a beer."
requires-python = ">=3.8"
license = "MIT"

[project.scripts]
loopsie = "loopsie:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["loopsie"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
