[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loopsie"
version = "0.1.1"
description = "Make a loop, grab a beer."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Gavin Vickery", email = "gavin@geekforbrains.com" }]

[project.urls]
Homepage = "https://github.com/geekforbrains/loopsie"
Repository = "https://github.com/geekforbrains/loopsie"
Issues = "https://github.com/geekforbrains/loopsie/issues"

[project.scripts]
loopsie = "loopsie:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["loopsie"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
