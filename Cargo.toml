[package]
name = "loopsie"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
description = "Small, resilient command loops"
license = "MIT"
authors = ["Gavin Vickery <gavin@geekforbrains.com>"]
repository = "https://github.com/geekforbrains/loopsie"

[dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
